name: ERA5 E2 50-cell matching
on:
  push:
    paths: ['.github/workflows/era5-e2.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: era5-e2
  cancel-in-progress: false
jobs:
  match:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python src/pilot_events.py
      - run: python src/match_era5_pilot.py --per-group 25
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: era5-e2-summary
          path: |
            pilot_manifest.json
            match_summary.json
          if-no-files-found: error
