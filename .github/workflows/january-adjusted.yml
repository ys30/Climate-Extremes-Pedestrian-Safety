name: January adjusted severity models
on:
  push:
    paths: ['.github/workflows/january-adjusted.yml','src/january_adjusted.py']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  models:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/cache/restore@v4
        with:
          path: weather_cache
          key: era5-january-2022-v1-adjusted-${{ github.run_id }}
          restore-keys: |
            era5-january-2022-v1-
          fail-on-cache-miss: true
      - run: pip install 'pandas==2.2.3' 'statsmodels==0.14.5'
      - run: python src/pilot_events.py
      - run: python src/january_adjusted.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: january-adjusted-results
          path: |
            control_codes.json
            adjusted_models.json
          if-no-files-found: error
