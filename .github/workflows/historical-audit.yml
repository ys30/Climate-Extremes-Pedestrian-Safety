name: STATS19 historical audit
on:
  push:
    paths: ['src/historical_audit.py','.github/workflows/historical-audit.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  historical:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python src/historical_audit.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: historical-audit-2016-2020
          path: results/*.json
          if-no-files-found: error
