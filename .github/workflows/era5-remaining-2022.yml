name: ERA5 remaining 2022 months
on:
  push:
    paths: ['.github/workflows/era5-remaining-2022.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: era5-remaining-2022
  cancel-in-progress: false
jobs:
  month:
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        month: [2, 4, 5, 6, 8, 9, 11, 12]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/cache/restore@v4
        with:
          path: weather_cache
          key: era5-2022-month-${{ matrix.month }}-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            era5-2022-month-${{ matrix.month }}-v1-
      - run: python src/pilot_events.py --month ${{ matrix.month }}
      - run: python src/match_era5_pilot.py --month ${{ matrix.month }} --all
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: weather_cache
          key: era5-2022-month-${{ matrix.month }}-v1-${{ github.run_id }}-${{ github.run_attempt }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: monthly-2022-${{ matrix.month }}
          path: |
            pilot_manifest.json
            match_summary.json
          if-no-files-found: error
